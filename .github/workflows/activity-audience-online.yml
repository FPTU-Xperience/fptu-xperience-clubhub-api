name: Verify deployed activity audience release
on:
  push:
    branches: [fix/activity-audience-production-20261103]
    paths: [.github/workflows/activity-audience-online.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  online:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wait for the validated release and verify public API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url = 'https://api.github.com/repos/FPTU-Xperience/fptu-xperience-clubhub-api/actions/runs/41605909513';
          let deployed = false;
          for (let attempt = 0; attempt < 120; attempt++) {
            const response = await fetch(url, { headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json' } });
            assert.equal(response.status, 200);
            const run = await response.json();
            assert.equal(run.head_sha, '0d38e9ed1af75455ce4bf26bdff75bef047756a0');
            if (run.status === 'completed') {
              assert.equal(run.conclusion, 'success', 'Expected release deployed successfully');
              deployed = true;
              break;
            }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          assert.ok(deployed, 'Release finished within verification window');
          const base = 'https://clubreporthub.duckdns.org';
          for (const path of ['/health', '/api/health', '/api/auth/health']) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(20000) });
            assert.equal(response.status, 200, path);
            console.log('ONLINE_HEALTH_OK ' + path + ' 200');
          }
          for (const path of ['/api/v2/activities/feed', '/api/v2/activities/1/sessions']) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(20000) });
            assert.equal(response.status, 401, 'Anonymous protected route: ' + path);
            console.log('ONLINE_AUTH_BOUNDARY_OK ' + path + ' 401');
          }
          console.log('ONLINE_ACTIVITY_RELEASE_OK 0d38e9ed1af75455ce4bf26bdff75bef047756a0');
          console.log('Authenticated student registration was tested in CI; no production account was created or impersonated.');
          NODE
