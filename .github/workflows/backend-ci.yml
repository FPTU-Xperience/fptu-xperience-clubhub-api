name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    uses: ./.github/workflows/backend-validate.yml

  admin-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AdminService production image
        run: docker build --file src/Services/AdminService/Dockerfile --tag clubreporthub-admin:ci .
