name: Stop orphaned release build clients
on:
  push:
    branches: [fix/activity-audience-production-20261103]
    paths: [.github/workflows/stop-orphan-release-build.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Inspect and stop only orphaned compose build clients
        uses: appleboy/ssh-action@v1.0.3
        env:
          EXPECTED_RELEASE: /${{ secrets.VPC_USERNAME }}/fptux/legacy/legacy-api/releases/0d38e9ed1af75455ce4bf26bdff75bef047756a0
        with:
          envs: EXPECTED_RELEASE
          host: ${{ secrets.VPC_HOST }}
          username: ${{ secrets.VPC_USERNAME }}
          key: ${{ secrets.VPC_SSH_KEY }}
          passphrase: ${{ secrets.VPC_SSH_PASSPHRASE }}
          password: ${{ secrets.VPC_PASSWORD }}
          command_timeout: 2m
          script: |
            python3 - <<'PY'
            import os, pathlib, signal
            expected = os.path.realpath(os.environ['EXPECTED_RELEASE'])
            matches = []
            for proc in pathlib.Path('/proc').iterdir():
                if not proc.name.isdigit():
                    continue
                try:
                    comm = (proc / 'comm').read_text().strip()
                    if comm not in ('docker', 'docker-compose', 'docker-buildx'):
                        continue
                    args = (proc / 'cmdline').read_bytes().split(b'\0')
                    if b'build' not in args or os.path.realpath(proc / 'cwd') != expected:
                        continue
                    matches.append((int(proc.name), comm))
                except (FileNotFoundError, ProcessLookupError, PermissionError):
                    continue
            for pid, comm in matches:
                print('Stopping previous release build client:', pid, comm, flush=True)
                try:
                    os.kill(pid, signal.SIGTERM)
                except ProcessLookupError:
                    pass
            print('Matched build clients:', len(matches), flush=True)
            PY
            ps -eo pid,ppid,comm,etime,pcpu,pmem | awk 'NR == 1 || $3 ~ /^(docker|docker-compose|docker-buildx|buildkitd|dotnet)$/'
            free -m
            df -h /
