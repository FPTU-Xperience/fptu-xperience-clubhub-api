name: Deploy to Ubuntu VPC
on:
  push:
    branches: [cuongnk/implement-api-contract]
    paths: [.github/workflows/deployment.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-internal-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Read internal activity registration contracts
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPC_HOST }}
          username: ${{ secrets.VPC_USERNAME }}
          key: ${{ secrets.VPC_SSH_KEY }}
          passphrase: ${{ secrets.VPC_SSH_PASSPHRASE }}
          password: ${{ secrets.VPC_PASSWORD }}
          command_timeout: 2m
          script: |
            docker exec clubreporthub-sqlserver bash -c 'SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -d ClubReportHub_Activity -W -s "|" -Q "SET NOCOUNT ON; SELECT TOP(20) Id, Title, IsInternal, PublicationStatus, Status, RegistrationOpensAt, RegistrationClosesAt, StartTimeUtc, EndTimeUtc, Capacity, RegisteredCount FROM Activities WHERE IsInternal = 1 ORDER BY Id;"'
  registration-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global gitnexus
      - name: Inspect student and legacy participation graph
        run: |
          gitnexus analyze --index-only
          gitnexus query "student legacy internal registration eligibility" --repo .
          gitnexus context 'Method:src/Services/ActivityService/Endpoints/StudentActivityEndpoints.cs:StudentActivityEndpoints.ReadAsync#17' --repo .
          gitnexus impact 'Method:src/Services/ActivityService/Endpoints/StudentActivityEndpoints.cs:StudentActivityEndpoints.ReadAsync#17' --direction upstream --repo .
          gitnexus context RegisterParticipant --repo .
          git grep -n 'PublicationStatus.*LEGACY\|var canRegister\|RegistrationOpensAt\|RegistrationClosesAt' -- src/Services/ActivityService/Endpoints/ActivityWriteEndpoints.cs src/Services/ActivityService/Endpoints/StudentActivityEndpoints.cs
