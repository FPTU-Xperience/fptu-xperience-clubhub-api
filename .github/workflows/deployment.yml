name: Deploy to Ubuntu VPC
on:
  push:
    branches: [cuongnk/implement-api-contract]
    paths: [.github/workflows/deployment.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Read bounded release disk inventory without changing services
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_ROOT: /${{ secrets.VPC_USERNAME }}/fptux/legacy/legacy-api/releases
        with:
          host: ${{ secrets.VPC_HOST }}
          username: ${{ secrets.VPC_USERNAME }}
          key: ${{ secrets.VPC_SSH_KEY }}
          passphrase: ${{ secrets.VPC_SSH_PASSPHRASE }}
          password: ${{ secrets.VPC_PASSWORD }}
          envs: RELEASE_ROOT
          command_timeout: 3m
          script: |
            set -euo pipefail
            df -h /var/lib/docker
            docker system df
            docker ps -a --format 'QUEUE_CONTAINER {{.Names}} {{.Image}} {{.Status}}'
            docker image ls --filter 'reference=clubreporthub-*' --format 'QUEUE_IMAGE {{.Repository}} {{.Tag}} {{.ID}} {{.Size}}'
            if test -d "${RELEASE_ROOT}"; then
              find "${RELEASE_ROOT}" -maxdepth 4 -type f \( -name '*.tar.gz' -o -name '*.tar' \) -printf 'QUEUE_ARCHIVE %s %p\n'
              du -x -h --max-depth=1 "${RELEASE_ROOT}" | sort -h | tail -25
            fi
