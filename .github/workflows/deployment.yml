              test '${{ matrix.name }}' = report
              old_image="$(docker image inspect clubreporthub-report:rollback-c12-ae9e871 --format '{{.Id}}')"
            fi
            network="$(docker inspect clubreporthub-activity --format '{{range $key, $value := .NetworkSettings.Networks}}{{$key}}{{end}}')"
            test -n "${network}"
