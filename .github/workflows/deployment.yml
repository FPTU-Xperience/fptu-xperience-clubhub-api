name: Deploy to Ubuntu VPC
on:
  push:
    branches: [cuongnk/implement-api-contract]
    paths: [.github/workflows/deployment.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  build-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 501548a27058e0bc7c65087f2d5a985448a1e512
          fetch-depth: 0
      - name: Verify exact source full CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response = await fetch('https://api.github.com/repos/FPTU-Xperience/fptu-xperience-clubhub-api/actions/runs/41817103947',
            {headers:{Authorization:'Bearer '+process.env.GH_TOKEN}});
          assert.equal(response.status,200);
          const run=await response.json();
          assert.equal(run.head_sha,'501548a27058e0bc7c65087f2d5a985448a1e512');
          assert.equal(run.status,'completed');
          assert.equal(run.conclusion,'success');
          NODE
  deploy:
    needs: build-auth
    if: github.ref == 'refs/heads/cuongnk/implement-api-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validated-auth-release
          path: auth-image
          github-token: ${{ github.token }}
          run-id: 41818275177
      - name: Remove only superseded deployment image archives
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_ROOT: /${{ secrets.VPC_USERNAME }}/fptux/legacy/legacy-api/releases
        with:
          host: ${{ secrets.VPC_HOST }}
          username: ${{ secrets.VPC_USERNAME }}
          key: ${{ secrets.VPC_SSH_KEY }}
          passphrase: ${{ secrets.VPC_SSH_PASSPHRASE }}
          password: ${{ secrets.VPC_PASSWORD }}
          envs: RELEASE_ROOT
          script: |
            set -Eeuo pipefail
            root="$(realpath -e "${RELEASE_ROOT}")"
            test "${root}" != /
            df -h "${root}"
            for relative in \
              501548a27058e0bc7c65087f2d5a985448a1e512/auth-localhost/auth-image/image.tar.gz \
              ee105a6d1ee364e84668d08a16de63b83d317f5e/auth-localhost/auth-image/image.tar.gz \
              39b82c5942c24f0ab9e68f6687891162f5c15ec7/prebuilt-final/club-image/images.tar.gz; do
              archive="${root}/${relative}"
              if [ -f "${archive}" ]; then
                resolved="$(realpath -e "${archive}")"
                case "${resolved}" in "${root}/"*) ;; *) exit 1 ;; esac
                test ! -L "${archive}"
                du -h "${archive}"
                rm -- "${archive}"
              fi
            done
            df -h "${root}"
      - name: Transfer validated image
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPC_HOST }}
          username: ${{ secrets.VPC_USERNAME }}
          key: ${{ secrets.VPC_SSH_KEY }}
          passphrase: ${{ secrets.VPC_SSH_PASSPHRASE }}
          password: ${{ secrets.VPC_PASSWORD }}
          source: auth-image
          target: /${{ secrets.VPC_USERNAME }}/fptux/legacy/legacy-api/releases/${{ github.sha }}/auth-localhost
          rm: false
      - name: Roll out AuthService preserving runtime with rollback
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_DIR: /${{ secrets.VPC_USERNAME }}/fptux/legacy/legacy-api/releases/${{ github.sha }}/auth-localhost
          IMAGE_TAG: clubreporthub-auth:501548a27058e0bc7c65087f2d5a985448a1e512
        with:
          host: ${{ secrets.VPC_HOST }}
          username: ${{ secrets.VPC_USERNAME }}
          key: ${{ secrets.VPC_SSH_KEY }}
          passphrase: ${{ secrets.VPC_SSH_PASSPHRASE }}
          password: ${{ secrets.VPC_PASSWORD }}
          envs: IMAGE_DIR,IMAGE_TAG
          command_timeout: 15m
          script: |
            set -Eeuo pipefail
            umask 077
            cd "${IMAGE_DIR}"
            sha256sum --check auth-image/image.sha256
            docker load --input auth-image/image.tar.gz
            new_image="$(docker image inspect "${IMAGE_TAG}" --format '{{.Id}}')"
            old_image="$(docker image inspect clubreporthub-auth:rollback-3d6167919f36d2d5ac825e1f1b405d7ac083b1b0 --format '{{.Id}}')"
            project="$(docker inspect clubreporthub-auth --format '{{ index .Config.Labels "com.docker.compose.project" }}')"
            workdir="$(docker inspect clubreporthub-auth --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}')"
            configs="$(docker inspect clubreporthub-auth --format '{{ index .Config.Labels "com.docker.compose.project.config_files" }}')"
            test "$(docker inspect clubreporthub-auth --format '{{ index .Config.Labels "com.docker.compose.service" }}')" = auth-service
            test -n "${project}"
            test -d "${workdir}"
            docker image inspect "${old_image}" >/dev/null
            export NEW_IMAGE="${new_image}" OLD_IMAGE="${old_image}"
            runtime_exports="$(python3 - <<'PY'
            import json, os, re, shlex, subprocess
            data = json.loads(subprocess.check_output(['docker', 'inspect', 'clubreporthub-auth'], text=True))[0]
            env = dict(item.split('=', 1) for item in data['Config']['Env'])
            # Compose interpolates dollars even in JSON. Escape each value while retaining exact runtime settings.
            preserved = {key: value.replace('$', '$$') for key, value in env.items()}
            for filename, image in [('auth.override.json', os.environ['NEW_IMAGE']), ('auth.rollback.json', os.environ['OLD_IMAGE'])]:
                with open(os.path.join(os.environ['IMAGE_DIR'], filename), 'w') as f:
                    json.dump({'services': {'auth-service': {'image': image, 'environment': preserved}}}, f)
            with open(os.path.join(os.environ['IMAGE_DIR'], 'auth.runtime.json'), 'w') as f:
                json.dump(env, f)
            connection = env.get('ConnectionStrings__DefaultConnection', '')
            match = re.search(r'''(?:^|;)\s*(?:Password|Pwd)\s*=\s*("(?:""|[^"])*"|'(?:''|[^'])*'|[^;]*)''', connection, re.IGNORECASE)
            if not match: raise RuntimeError('Cannot preserve database configuration')
            activity_env = json.loads(subprocess.check_output(['docker','inspect','--format','{{json .Config.Env}}','clubreporthub-activity'],text=True))
            activity = dict(item.split('=',1) for item in activity_env)
            values = {'SQL_PASSWORD': match.group(1).strip(), 'JWT_SIGNING_KEY': env.get('Jwt__SigningKey'),
                'INTERNAL_WORKFLOW_TOKEN': env.get('Security__InternalWorkflowToken'),
                'ATTENDANCE_SIGNING_KEY': activity.get('Attendance__SigningKey'), 'FRONTEND_ORIGIN': env.get('Cors__AllowedOrigins__0')}
            for key, value in values.items():
                if not value: raise RuntimeError('Missing required runtime setting: ' + key)
                print('export ' + key + '=' + shlex.quote(value))
            PY
            )"
            eval "${runtime_exports}"
            unset runtime_exports
            args=()
            IFS=',' read -ra files <<< "${configs}"
            for file in "${files[@]}"; do test -f "${file}"; args+=(-f "${file}"); done
            cd "${workdir}"
            rollback() {
              docker compose -p "${project}" "${args[@]}" -f "${IMAGE_DIR}/auth.rollback.json" up -d --no-build --no-deps auth-service
              echo 'Auth rollout failed; restored pre-change source image and preserved runtime.' >&2
            }
            trap rollback ERR
            docker compose -p "${project}" "${args[@]}" -f "${IMAGE_DIR}/auth.override.json" up -d --no-build --no-deps auth-service
            healthy=false
            for attempt in $(seq 1 30); do
              if [ "$(docker inspect clubreporthub-auth --format '{{.Image}}')" = "${new_image}" ] && curl --fail --silent --show-error --max-time 10 https://clubreporthub.duckdns.org/api/auth/health; then
                healthy=true
                break
              fi
              sleep 2
            done
            test "${healthy}" = true
            python3 - <<'PY'
            import json, os, subprocess, urllib.request, urllib.error
            expected = json.load(open(os.path.join(os.environ['IMAGE_DIR'], 'auth.runtime.json')))
            actual = json.loads(subprocess.check_output(['docker','inspect','--format','{{json .Config.Env}}','clubreporthub-auth'],text=True))
            assert dict(item.split('=',1) for item in actual) == expected, 'Runtime configuration changed'
            for origin in ['http://localhost:5173', 'http://localhost:5174', 'https://fptux-clubhub-ui.pages.dev', 'https://fptux-admin-ui.pages.dev', 'http://localhost:5175', 'http://localhost:5173.attacker.example']:
                for method in ['GET','POST']:
                    req = urllib.request.Request('https://clubreporthub.duckdns.org/api/auth/session', method=method,
                        headers={'Origin':origin, 'X-FPTUX-Session':'1'}, data=b'' if method=='POST' else None)
                    try: status = urllib.request.urlopen(req, timeout=20).status
                    except urllib.error.HTTPError as error: status = error.code
                    allowed = origin in ['http://localhost:5173','http://localhost:5174','https://fptux-clubhub-ui.pages.dev','https://fptux-admin-ui.pages.dev']
                    assert status == (204 if allowed else 403), (origin,method,status)
                    print('ONLINE_SESSION', method, origin, status)
            print('AUTH_RUNTIME_PRESERVED')
            PY
            trap - ERR
            printf 'AUTH_IMAGE_DEPLOYED %s\n' "${new_image}"
