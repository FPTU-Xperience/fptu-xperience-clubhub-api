name: Deploy to Ubuntu VPC

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/backend-validate.yml

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required-reviewer protection can be configured for this environment in repository settings.
    environment: production
    env:
      TARGET_ROOT: /${{ secrets.VPC_USERNAME }}/fptux/legacy/legacy-api
      RELEASE_DIR: /${{ secrets.VPC_USERNAME }}/fptux/legacy/legacy-api/releases/${{ github.sha }}
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4

      - name: Copy source into versioned release directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPC_HOST }}
          username: ${{ secrets.VPC_USERNAME }}
          password: ${{ secrets.VPC_PASSWORD }}
          source: "."
          target: ${{ env.RELEASE_DIR }}
          rm: true

      - name: Build, start, and verify production stack
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_ROOT: ${{ env.TARGET_ROOT }}
          RELEASE_DIR: ${{ env.RELEASE_DIR }}
          COMPOSE_PROJECT_NAME: legacy-api
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          CORS_ADDITIONAL_ORIGINS: ${{ vars.CORS_ADDITIONAL_ORIGINS }}
          GOOGLE_CLIENT_ID: ${{ secrets.CLUBHUB_GOOGLE_CLIENT_ID }}
          GOOGLE_ALLOWED_HOSTED_DOMAIN: ${{ secrets.GOOGLE_ALLOWED_HOSTED_DOMAIN }}
          GOOGLE_ALLOWED_EMAIL_DOMAINS: ${{ secrets.GOOGLE_ALLOWED_EMAIL_DOMAINS }}
        with:
          host: ${{ secrets.VPC_HOST }}
          username: ${{ secrets.VPC_USERNAME }}
          password: ${{ secrets.VPC_PASSWORD }}
          command_timeout: 25m
          envs: TARGET_ROOT,RELEASE_DIR,COMPOSE_PROJECT_NAME,SQL_PASSWORD,JWT_SIGNING_KEY,FRONTEND_ORIGIN,CORS_ADDITIONAL_ORIGINS,GOOGLE_CLIENT_ID,GOOGLE_ALLOWED_HOSTED_DOMAIN,GOOGLE_ALLOWED_EMAIL_DOMAINS
          script: |
            set -Eeuo pipefail

            export COMPOSE_PARALLEL_LIMIT="${COMPOSE_PARALLEL_LIMIT:-4}"

            cd "${RELEASE_DIR}"
            docker compose -p "${COMPOSE_PROJECT_NAME}" config --quiet

            if docker container inspect clubreporthub-sqlserver >/dev/null 2>&1; then
              existing_project="$(
                docker inspect clubreporthub-sqlserver \
                  --format '{{ index .Config.Labels "com.docker.compose.project" }}'
              )"
              if [ "${existing_project}" != "${COMPOSE_PROJECT_NAME}" ]; then
                echo "Refusing deployment: existing SQL container belongs to Compose project '${existing_project}', expected '${COMPOSE_PROJECT_NAME}'." >&2
                exit 1
              fi
            fi

            docker compose -p "${COMPOSE_PROJECT_NAME}" build

            previous_release="$(readlink -f "${TARGET_ROOT}/current" 2>/dev/null || true)"
            rollback() {
              trap - ERR
              if [ -n "${previous_release}" ] && [ -f "${previous_release}/docker-compose.yml" ]; then
                echo "Deployment failed; rolling back to ${previous_release}." >&2
                cd "${previous_release}"
                docker compose -p "${COMPOSE_PROJECT_NAME}" up -d --build --remove-orphans
              else
                echo "Deployment failed; no previous versioned release is available for rollback." >&2
              fi
            }
            trap rollback ERR

            docker compose -p "${COMPOSE_PROJECT_NAME}" up -d --no-build --remove-orphans

            gateway_port="${GATEWAY_PORT:-7000}"
            network_name="${COMPOSE_PROJECT_NAME}_internal-net"

            wait_for_gateway() {
              gateway_url="http://127.0.0.1:${gateway_port}/health"
              echo "Checking Gateway readiness at ${gateway_url}."

              for attempt in $(seq 1 30); do
                if gateway_probe_error="$(curl \
                  --fail \
                  --silent \
                  --show-error \
                  --connect-timeout 3 \
                  --max-time 5 \
                  "${gateway_url}" 2>&1)"; then
                  echo "Gateway is healthy (attempt ${attempt}/30)."
                  return 0
                fi

                if [ "${attempt}" -eq 30 ]; then
                  echo "Gateway failed to become healthy after ${attempt} attempts." >&2
                  echo "Last Gateway probe error: ${gateway_probe_error}" >&2
                  docker ps >&2 || true
                  docker logs --tail 200 clubreporthub-gateway >&2 || true
                  return 1
                fi

                echo "Waiting for Gateway readiness (${attempt}/30)..."
                sleep 3
              done
            }

            wait_for_internal_service() {
              service_name="$1"
              container_name="$2"
              health_path="$3"
              service_url="http://${service_name}:8080${health_path}"
              echo "Checking ${service_name} readiness at ${service_url}."

              for attempt in $(seq 1 30); do
                if service_probe_error="$(docker run --rm --network "${network_name}" curlimages/curl:8.10.1 \
                  --fail \
                  --silent \
                  --show-error \
                  --connect-timeout 3 \
                  --max-time 5 \
                  "${service_url}" 2>&1)"; then
                  echo "${service_name} is healthy (attempt ${attempt}/30)."
                  return 0
                fi

                if [ "${attempt}" -eq 30 ]; then
                  echo "${service_name} failed to become healthy after ${attempt} attempts." >&2
                  echo "Last ${service_name} probe error: ${service_probe_error}" >&2
                  docker ps >&2 || true
                  docker logs --tail 200 "${container_name}" >&2 || true
                  return 1
                fi

                echo "Waiting for ${service_name} readiness (${attempt}/30)..."
                sleep 3
              done
            }

            wait_for_gateway
            wait_for_internal_service auth-service clubreporthub-auth /health
            wait_for_internal_service club-service clubreporthub-club /health
            wait_for_internal_service activity-service clubreporthub-activity /health
            wait_for_internal_service report-service clubreporthub-report /health
            wait_for_internal_service finance-service clubreporthub-finance /health
            wait_for_internal_service notification-service clubreporthub-notification /health
            wait_for_internal_service export-service clubreporthub-export /health
            wait_for_internal_service admin-service clubreporthub-admin /health/ready

            ln -sfn "${RELEASE_DIR}" "${TARGET_ROOT}/current"
            trap - ERR
            docker image prune -f
