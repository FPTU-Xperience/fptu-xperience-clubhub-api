name: Deploy to Ubuntu VPC
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/backend-validate.yml
  build-club:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build validated ClubService on CI
        run: |
          docker build --file src/Services/ClubService/Dockerfile --tag clubreporthub-club:${{ github.sha }} .
          mkdir -p club-image
          docker save clubreporthub-club:${{ github.sha }} | gzip > club-image/image.tar.gz
          sha256sum club-image/image.tar.gz > club-image/image.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: validated-club-release
          path: club-image
          retention-days: 3
  deploy:
    needs: build-club
    if: github.ref == 'refs/heads/cuongnk/implement-api-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validated-club-release
          path: club-image
      - name: Measure validated image
        run: echo "ARCHIVE_BYTES=$(stat -c %s club-image/image.tar.gz)" >> "$GITHUB_ENV"
      - name: Verify available disk and exact rollback image
        uses: appleboy/ssh-action@v1.0.3
        env:
          ARCHIVE_BYTES: ${{ env.ARCHIVE_BYTES }}
        with:
          host: ${{ secrets.VPC_HOST }}
          username: ${{ secrets.VPC_USERNAME }}
          key: ${{ secrets.VPC_SSH_KEY }}
          passphrase: ${{ secrets.VPC_SSH_PASSPHRASE }}
          password: ${{ secrets.VPC_PASSWORD }}
          envs: ARCHIVE_BYTES
          script: |
            set -euo pipefail
            available=$(df -PB1 /var/lib/docker | awk 'NR==2 {print $4}')
            test "${available}" -gt "$((ARCHIVE_BYTES * 3 + 536870912))"
            old=$(docker inspect clubreporthub-club --format '{{.Image}}')
            docker image inspect "${old}" >/dev/null
            printf 'CLUB_ROLLBACK_AVAILABLE %s DISK_BYTES %s\n' "${old}" "${available}"
      - name: Transfer validated image
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPC_HOST }}
          username: ${{ secrets.VPC_USERNAME }}
          key: ${{ secrets.VPC_SSH_KEY }}
          passphrase: ${{ secrets.VPC_SSH_PASSPHRASE }}
          password: ${{ secrets.VPC_PASSWORD }}
          source: club-image
          target: /${{ secrets.VPC_USERNAME }}/fptux/legacy/legacy-api/releases/${{ github.sha }}/displayname-club
          rm: false
      - name: Roll out ClubService preserving runtime with rollback
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_DIR: /${{ secrets.VPC_USERNAME }}/fptux/legacy/legacy-api/releases/${{ github.sha }}/displayname-club
          IMAGE_TAG: clubreporthub-club:${{ github.sha }}
        with:
          host: ${{ secrets.VPC_HOST }}
          username: ${{ secrets.VPC_USERNAME }}
          key: ${{ secrets.VPC_SSH_KEY }}
          passphrase: ${{ secrets.VPC_SSH_PASSPHRASE }}
          password: ${{ secrets.VPC_PASSWORD }}
          envs: IMAGE_DIR,IMAGE_TAG
          command_timeout: 15m
          script: |
            set -Eeuo pipefail
            umask 077
            cd "${IMAGE_DIR}"
            sha256sum --check club-image/image.sha256
            docker load --input club-image/image.tar.gz
            new_image="$(docker image inspect "${IMAGE_TAG}" --format '{{.Id}}')"
            old_image="$(docker inspect clubreporthub-club --format '{{.Image}}')"
            network="$(docker inspect clubreporthub-club --format '{{range $key, $value := .NetworkSettings.Networks}}{{$key}}{{end}}')"
            test -n "${network}"
            docker image inspect curlimages/curl:8.10.1 >/dev/null
            project="$(docker inspect clubreporthub-club --format '{{ index .Config.Labels "com.docker.compose.project" }}')"
            workdir="$(docker inspect clubreporthub-club --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}')"
            configs="$(docker inspect clubreporthub-club --format '{{ index .Config.Labels "com.docker.compose.project.config_files" }}')"
            test "$(docker inspect clubreporthub-club --format '{{ index .Config.Labels "com.docker.compose.service" }}')" = club-service
            test -n "${project}"
            test -d "${workdir}"
            docker image inspect "${old_image}" >/dev/null
            export NEW_IMAGE="${new_image}" OLD_IMAGE="${old_image}"
            runtime_exports="$(python3 - <<'PY'
            import json, os, re, shlex, subprocess
            data = json.loads(subprocess.check_output(['docker', 'inspect', 'clubreporthub-club'], text=True))[0]
            env = dict(item.split('=', 1) for item in data['Config']['Env'])
            # Compose interpolates dollars even in JSON. Escape each value while retaining exact runtime settings.
            preserved = {key: value.replace('$', '$$') for key, value in env.items()}
            for filename, image in [('club.override.json', os.environ['NEW_IMAGE']), ('club.rollback.json', os.environ['OLD_IMAGE'])]:
                with open(os.path.join(os.environ['IMAGE_DIR'], filename), 'w') as f:
                    json.dump({'services': {'club-service': {'image': image, 'environment': preserved}}}, f)
            with open(os.path.join(os.environ['IMAGE_DIR'], 'club.runtime.json'), 'w') as f:
                json.dump(env, f)
            auth_data = json.loads(subprocess.check_output(['docker','inspect','--format','{{json .Config.Env}}','clubreporthub-auth'],text=True))
            auth = dict(item.split('=',1) for item in auth_data)
            connection = auth.get('ConnectionStrings__DefaultConnection', '')
            match = re.search(r'''(?:^|;)\s*(?:Password|Pwd)\s*=\s*("(?:""|[^"])*"|'(?:''|[^'])*'|[^;]*)''', connection, re.IGNORECASE)
            if not match: raise RuntimeError('Cannot preserve database configuration')
            activity_env = json.loads(subprocess.check_output(['docker','inspect','--format','{{json .Config.Env}}','clubreporthub-activity'],text=True))
            activity = dict(item.split('=',1) for item in activity_env)
            values = {'SQL_PASSWORD': match.group(1).strip(), 'JWT_SIGNING_KEY': auth.get('Jwt__SigningKey'),
                'INTERNAL_WORKFLOW_TOKEN': auth.get('Security__InternalWorkflowToken'),
                'ATTENDANCE_SIGNING_KEY': activity.get('Attendance__SigningKey'), 'FRONTEND_ORIGIN': auth.get('Cors__AllowedOrigins__0')}
            for key, value in values.items():
                if not value: raise RuntimeError('Missing required runtime setting: ' + key)
                print('export ' + key + '=' + shlex.quote(value))
            PY
            )"
            eval "${runtime_exports}"
            unset runtime_exports
            args=()
            IFS=',' read -ra files <<< "${configs}"
            for file in "${files[@]}"; do test -f "${file}"; args+=(-f "${file}"); done
            cd "${workdir}"
            rollback() {
              docker compose -p "${project}" "${args[@]}" -f "${IMAGE_DIR}/club.rollback.json" up -d --no-build --no-deps club-service
              echo 'Club rollout failed; restored exact previous image and runtime.' >&2
            }
            trap rollback ERR
            docker compose -p "${project}" "${args[@]}" -f "${IMAGE_DIR}/club.override.json" up -d --no-build --no-deps club-service
            healthy=false
            for attempt in $(seq 1 30); do
              if [ "$(docker inspect clubreporthub-club --format '{{.Image}}')" = "${new_image}" ] && docker run --rm --pull never --network "${network}" curlimages/curl:8.10.1 --fail --silent --show-error --connect-timeout 3 --max-time 5 http://club-service:8080/health; then
                healthy=true
                break
              fi
              sleep 2
            done
            test "${healthy}" = true
            python3 - <<'PY'
            import json, os, subprocess, urllib.request, urllib.error
            expected = json.load(open(os.path.join(os.environ['IMAGE_DIR'], 'club.runtime.json')))
            actual = json.loads(subprocess.check_output(['docker','inspect','--format','{{json .Config.Env}}','clubreporthub-club'],text=True))
            assert dict(item.split('=',1) for item in actual) == expected, 'Runtime configuration changed'
            print('CLUB_RUNTIME_PRESERVED')
            PY
            trap - ERR
            rm -- "${IMAGE_DIR}/club-image/image.tar.gz"
            printf 'CLUB_IMAGE_DEPLOYED %s\n' "${new_image}"
