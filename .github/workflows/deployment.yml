name: Deploy to Ubuntu VPC
on:
  push:
    branches: [cuongnk/implement-api-contract]
    paths: [.github/workflows/deployment.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-registration-state:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global gitnexus
      - run: |
          gitnexus analyze --index-only
          gitnexus query "StudentActivityItem registered participant detail" --repo .
          gitnexus context StudentActivityItem --repo .
          gitnexus impact StudentActivityItem --direction upstream --repo .
          gitnexus context 'Method:src/Services/ActivityService/Endpoints/StudentActivityEndpoints.cs:StudentActivityEndpoints.ReadAsync#17' --repo .
          gitnexus impact 'Method:src/Services/ActivityService/Endpoints/StudentActivityEndpoints.cs:StudentActivityEndpoints.ReadAsync#17' --direction upstream --repo .
          git grep -n 'record StudentActivityItem\|class StudentActivityItem\|new StudentActivityItem' -- src tests
