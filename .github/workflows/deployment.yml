name: Deploy to Ubuntu VPC
on:
  push:
    branches: [cuongnk/implement-api-contract]
    paths: [.github/workflows/deployment.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  build-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify source validation and successful image build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const headers = { Authorization: 'Bearer ' + process.env.GH_TOKEN };
          const base = 'https://api.github.com/repos/FPTU-Xperience/fptu-xperience-clubhub-api/actions/runs/';
          const response = await fetch(base + '41605909431', { headers });
          assert.equal(response.status, 200);
          const ci = await response.json();
          assert.equal(ci.head_sha, '0d38e9ed1af75455ce4bf26bdff75bef047756a0');
          assert.equal(ci.conclusion, 'success');
          const jobsResponse = await fetch(base + '41612778513/jobs', { headers });
          assert.equal(jobsResponse.status, 200);
          const jobs = await jobsResponse.json();
          assert.equal(jobs.jobs.find(job => job.name === 'build-activity')?.conclusion, 'success');
          console.log('Validated release and pre-change images were built successfully.');
          NODE

  deploy:
    needs: build-activity
    if: github.ref == 'refs/heads/cuongnk/implement-api-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Rollout validated ActivityService with existing runtime config
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_DIR: /${{ secrets.VPC_USERNAME }}/fptux/legacy/legacy-api/releases/0d38e9ed1af75455ce4bf26bdff75bef047756a0/prebuilt-final
          IMAGE_TAG: clubreporthub-activity:0d38e9ed1af75455ce4bf26bdff75bef047756a0
          ROLLBACK_TAG: clubreporthub-activity:rollback-0a638e80d6ca789309e79afd09d92c8c7eb9f932
        with:
          host: ${{ secrets.VPC_HOST }}
          username: ${{ secrets.VPC_USERNAME }}
          key: ${{ secrets.VPC_SSH_KEY }}
          passphrase: ${{ secrets.VPC_SSH_PASSPHRASE }}
          password: ${{ secrets.VPC_PASSWORD }}
          envs: IMAGE_DIR,IMAGE_TAG,ROLLBACK_TAG
          command_timeout: 15m
          script: |
            set -Eeuo pipefail
            umask 077
            cd "${IMAGE_DIR}"
            sha256sum --check activity-image/images.sha256
            project="$(docker inspect clubreporthub-activity --format '{{ index .Config.Labels "com.docker.compose.project" }}')"
            workdir="$(docker inspect clubreporthub-activity --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}')"
            configs="$(docker inspect clubreporthub-activity --format '{{ index .Config.Labels "com.docker.compose.project.config_files" }}')"
            service="$(docker inspect clubreporthub-activity --format '{{ index .Config.Labels "com.docker.compose.service" }}')"
            test "${service}" = activity-service
            test -n "${project}"
            test -d "${workdir}"
            network="$(docker inspect clubreporthub-activity --format '{{range $name, $details := .NetworkSettings.Networks}}{{$name}}{{"\n"}}{{end}}' | head -n 1)"
            if ! docker image inspect "${IMAGE_TAG}" >/dev/null 2>&1 || ! docker image inspect "${ROLLBACK_TAG}" >/dev/null 2>&1; then
              docker load --input activity-image/images.tar.gz
            fi
            new_image="$(docker image inspect "${IMAGE_TAG}" --format '{{.Id}}')"
            docker image inspect "${ROLLBACK_TAG}" --format '{{.Id}}'
            override="${IMAGE_DIR}/activity.override.yml"
            printf 'services:\n  activity-service:\n    image: %s\n' "${IMAGE_TAG}" > "${override}"
            args=()
            IFS=',' read -ra files <<< "${configs}"
            for file in "${files[@]}"; do test -f "${file}"; args+=(-f "${file}"); done
            cd "${workdir}"
            runtime_exports="$(python3 - <<'PY'
            import json, re, shlex, subprocess
            values = {}
            for name in ('clubreporthub-activity', 'clubreporthub-gateway'):
                data = json.loads(subprocess.check_output(['docker', 'inspect', '--format', '{{json .Config.Env}}', name], text=True))
                current = dict(item.split('=', 1) for item in data)
                if name == 'clubreporthub-activity':
                    mapping = {
                        'JWT_SIGNING_KEY': 'Jwt__SigningKey',
                        'INTERNAL_WORKFLOW_TOKEN': 'Security__InternalWorkflowToken',
                        'ATTENDANCE_SIGNING_KEY': 'Attendance__SigningKey',
                        'REDIS_STREAM_NAME': 'Redis__StreamName'
                    }
                    for variable, key in mapping.items():
                        if current.get(key):
                            values[variable] = current[key]
                    connection = current.get('ConnectionStrings__DefaultConnection', '')
                    pattern = r'''(?:^|;)\s*(?:Password|Pwd)\s*=\s*("(?:""|[^"])*"|'(?:''|[^'])*'|[^;]*)'''
                    match = re.search(pattern, connection, re.IGNORECASE)
                    if not match:
                        raise RuntimeError('Current ActivityService database password could not be preserved')
                    values['SQL_PASSWORD'] = match.group(1).strip()
                else:
                    values['FRONTEND_ORIGIN'] = current.get('Cors__AllowedOrigins__0', '')
            for variable in ('SQL_PASSWORD', 'JWT_SIGNING_KEY', 'INTERNAL_WORKFLOW_TOKEN', 'ATTENDANCE_SIGNING_KEY', 'FRONTEND_ORIGIN'):
                if not values.get(variable):
                    raise RuntimeError('Missing current runtime setting: ' + variable)
            for variable, value in values.items():
                print('export ' + variable + '=' + shlex.quote(value))
            PY
            )"
            eval "${runtime_exports}"
            unset runtime_exports
            successful=false
            if docker compose -p "${project}" "${args[@]}" -f "${override}" up -d --no-build --no-deps activity-service; then
              for attempt in $(seq 1 30); do
                if [ "$(docker inspect clubreporthub-activity --format '{{.Image}}')" = "${new_image}" ] &&
                  docker run --rm --network "${network}" curlimages/curl:8.10.1 --fail --silent --show-error --connect-timeout 3 --max-time 5 http://activity-service:8080/health; then
                  successful=true
                  break
                fi
                sleep 2
              done
            fi
            if [ "${successful}" != true ]; then
              printf 'services:\n  activity-service:\n    image: %s\n' "${ROLLBACK_TAG}" > "${override}"
              docker compose -p "${project}" "${args[@]}" -f "${override}" up -d --no-build --no-deps activity-service
              echo 'Activity rollout failed; restored image built from pre-change source.' >&2
              exit 1
            fi
            printf 'ACTIVITY_IMAGE_DEPLOYED 0d38e9ed1af75455ce4bf26bdff75bef047756a0 %s\n' "${new_image}"
            docker inspect clubreporthub-admin --format '{{range .Config.Env}}{{println .}}{{end}}' | awk '/^RECOMMENDATION_ENABLED=/ || /^Recommendation__Enabled=/ {print}'
      - name: Verify online health and authorization
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = 'https://clubreporthub.duckdns.org';
          for (const path of ['/health', '/api/health', '/api/auth/health']) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(20000) });
            assert.equal(response.status, 200, path);
            console.log('ONLINE_HEALTH_OK ' + path + ' 200');
          }
          for (const path of ['/api/v2/activities/feed', '/api/v2/activities/1/sessions']) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(20000) });
            assert.equal(response.status, 401, path);
            console.log('ONLINE_AUTH_BOUNDARY_OK ' + path + ' 401');
          }
          console.log('ONLINE_ACTIVITY_RELEASE_OK 0d38e9ed1af75455ce4bf26bdff75bef047756a0');
          NODE
