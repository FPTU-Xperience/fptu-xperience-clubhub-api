name: Deploy to Ubuntu VPC

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/backend-validate.yml

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required-reviewer protection can be configured for this environment in repository settings.
    environment: production
    env:
      TARGET_ROOT: /${{ secrets.VPC_USERNAME }}/fptux/legacy/legacy-api
      RELEASE_DIR: /${{ secrets.VPC_USERNAME }}/fptux/legacy/legacy-api/releases/${{ github.sha }}
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4

      - name: Copy source into versioned release directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPC_HOST }}
          username: ${{ secrets.VPC_USERNAME }}
          key: ${{ secrets.VPC_SSH_KEY }}
          passphrase: ${{ secrets.VPC_SSH_PASSPHRASE }}
          password: ${{ secrets.VPC_PASSWORD }}
          source: "."
          target: ${{ env.RELEASE_DIR }}
          # A rerun can target the active release; never delete it before validation.
          rm: false

      - name: Build, start, and verify production stack
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_ROOT: ${{ env.TARGET_ROOT }}
          RELEASE_DIR: ${{ env.RELEASE_DIR }}
          COMPOSE_PROJECT_NAME: fptux-clubhub-api
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          CORS_ADDITIONAL_ORIGINS: "${{ vars.CORS_ADDITIONAL_ORIGINS }},https://fptux-clubhub-ui.pages.dev,https://*.fptux-clubhub-ui.pages.dev,https://fptux-legacy-ui.pages.dev,https://*.fptux-legacy-ui.pages.dev"
          GOOGLE_CLIENT_ID: ${{ secrets.CLUBHUB_GOOGLE_CLIENT_ID }}
          GOOGLE_ALLOWED_HOSTED_DOMAIN: ${{ secrets.GOOGLE_ALLOWED_HOSTED_DOMAIN }}
          GOOGLE_ALLOWED_EMAIL_DOMAINS: ${{ secrets.GOOGLE_ALLOWED_EMAIL_DOMAINS }}
        with:
          host: ${{ secrets.VPC_HOST }}
          username: ${{ secrets.VPC_USERNAME }}
          key: ${{ secrets.VPC_SSH_KEY }}
          passphrase: ${{ secrets.VPC_SSH_PASSPHRASE }}
          password: ${{ secrets.VPC_PASSWORD }}
          command_timeout: 25m
          envs: TARGET_ROOT,RELEASE_DIR,COMPOSE_PROJECT_NAME,SQL_PASSWORD,JWT_SIGNING_KEY,FRONTEND_ORIGIN,CORS_ADDITIONAL_ORIGINS,GOOGLE_CLIENT_ID,GOOGLE_ALLOWED_HOSTED_DOMAIN,GOOGLE_ALLOWED_EMAIL_DOMAINS
          script: |
            set -Eeuo pipefail

            export COMPOSE_PARALLEL_LIMIT="${COMPOSE_PARALLEL_LIMIT:-4}"

            if docker container inspect clubreporthub-sqlserver >/dev/null 2>&1; then
              existing_project="$(
                docker inspect clubreporthub-sqlserver \
                  --format '{{ index .Config.Labels "com.docker.compose.project" }}'
              )"
              if [ -n "${existing_project}" ]; then
                echo "Preserving existing Compose project: '${existing_project}' to protect volume attachment."
                COMPOSE_PROJECT_NAME="${existing_project}"
              else
                echo "Existing SQL Server container has no Compose project label; refusing to guess its volume ownership." >&2
                exit 1
              fi
            fi

            cd "${RELEASE_DIR}"
            docker compose -p "${COMPOSE_PROJECT_NAME}" config --quiet

            if docker container inspect clubreporthub-sqlserver >/dev/null 2>&1; then
              if ! docker ps --format '{{.Names}}' | grep -q '^clubreporthub-sqlserver$'; then
                echo "SQL Server container exists but is not running; deployment aborted without changing it." >&2
                exit 1
              fi

              if ! docker exec clubreporthub-sqlserver /opt/mssql-tools18/bin/sqlcmd \
                -S localhost -U sa -P "${SQL_PASSWORD}" -C -b -Q "SELECT 1" >/dev/null 2>&1; then
                echo "SQL Server authentication with SQL_PASSWORD failed; deployment aborted without changing containers or volumes." >&2
                exit 1
              fi

              echo "Creating and verifying database backups before deployment..."
              backup_timestamp="$(date +%Y%m%d_%H%M%S)"
              docker exec clubreporthub-sqlserver /opt/mssql-tools18/bin/sqlcmd \
                -S localhost -U sa -P "${SQL_PASSWORD}" -C -b \
                -Q "
                  DECLARE @name NVARCHAR(256), @sql NVARCHAR(MAX);
                  DECLARE db_cursor CURSOR FOR
                    SELECT name FROM sys.databases WHERE name LIKE 'ClubReportHub_%';
                  OPEN db_cursor;
                  FETCH NEXT FROM db_cursor INTO @name;
                  WHILE @@FETCH_STATUS = 0
                  BEGIN
                    SET @sql = 'BACKUP DATABASE [' + @name + '] TO DISK = ''/var/opt/mssql/backup_' + @name + '_${backup_timestamp}.bak'' WITH FORMAT, INIT, CHECKSUM;';
                    EXEC sp_executesql @sql;
                    SET @sql = 'RESTORE VERIFYONLY FROM DISK = ''/var/opt/mssql/backup_' + @name + '_${backup_timestamp}.bak'' WITH CHECKSUM;';
                    EXEC sp_executesql @sql;
                    FETCH NEXT FROM db_cursor INTO @name;
                  END
                  CLOSE db_cursor;
                  DEALLOCATE db_cursor;
                "
            else
              echo "No existing SQL Server container; first deployment has no databases to back up."
            fi

            docker compose -p "${COMPOSE_PROJECT_NAME}" build

            previous_release="$(readlink -f "${TARGET_ROOT}/current" 2>/dev/null || true)"
            rollback() {
              trap - ERR
              if [ -n "${previous_release}" ] && [ -f "${previous_release}/docker-compose.yml" ]; then
                echo "Deployment failed; rolling back to ${previous_release}." >&2
                cd "${previous_release}"
                docker compose -p "${COMPOSE_PROJECT_NAME}" up -d --build --remove-orphans
              else
                echo "Deployment failed; no previous versioned release is available for rollback." >&2
              fi
            }
            trap rollback ERR

            docker compose -p "${COMPOSE_PROJECT_NAME}" up -d --no-build --remove-orphans

            gateway_port="${GATEWAY_PORT:-7000}"
            network_name="${COMPOSE_PROJECT_NAME}_internal-net"

            wait_for_gateway() {
              gateway_url="http://127.0.0.1:${gateway_port}/health"
              echo "Checking Gateway readiness at ${gateway_url}."

              for attempt in $(seq 1 30); do
                if gateway_probe_error="$(curl \
                  --fail \
                  --silent \
                  --show-error \
                  --connect-timeout 3 \
                  --max-time 5 \
                  "${gateway_url}" 2>&1)"; then
                  echo "Gateway is healthy (attempt ${attempt}/30)."
                  return 0
                fi

                if [ "${attempt}" -eq 30 ]; then
                  echo "Gateway failed to become healthy after ${attempt} attempts." >&2
                  echo "Last Gateway probe error: ${gateway_probe_error}" >&2
                  docker ps >&2 || true
                  docker logs --tail 200 clubreporthub-gateway >&2 || true
                  return 1
                fi

                echo "Waiting for Gateway readiness (${attempt}/30)..."
                sleep 3
              done
            }

            wait_for_internal_service() {
              service_name="$1"
              container_name="$2"
              health_path="$3"
              service_url="http://${service_name}:8080${health_path}"
              echo "Checking ${service_name} readiness at ${service_url}."

              for attempt in $(seq 1 30); do
                if service_probe_error="$(docker run --rm --network "${network_name}" curlimages/curl:8.10.1 \
                  --fail \
                  --silent \
                  --show-error \
                  --connect-timeout 3 \
                  --max-time 5 \
                  "${service_url}" 2>&1)"; then
                  echo "${service_name} is healthy (attempt ${attempt}/30)."
                  return 0
                fi

                if [ "${attempt}" -eq 30 ]; then
                  echo "${service_name} failed to become healthy after ${attempt} attempts." >&2
                  echo "Last ${service_name} probe error: ${service_probe_error}" >&2
                  docker ps >&2 || true
                  docker logs --tail 200 "${container_name}" >&2 || true
                  return 1
                fi

                echo "Waiting for ${service_name} readiness (${attempt}/30)..."
                sleep 3
              done
            }

            wait_for_gateway
            wait_for_internal_service auth-service clubreporthub-auth /health
            wait_for_internal_service club-service clubreporthub-club /health
            wait_for_internal_service activity-service clubreporthub-activity /health
            wait_for_internal_service report-service clubreporthub-report /health
            wait_for_internal_service finance-service clubreporthub-finance /health
            wait_for_internal_service notification-service clubreporthub-notification /health
            wait_for_internal_service export-service clubreporthub-export /health
            wait_for_internal_service admin-service clubreporthub-admin /health/ready

            ln -sfn "${RELEASE_DIR}" "${TARGET_ROOT}/current"
            trap - ERR
            docker image prune -f

            # Retain the 5 newest releases and always preserve active/rollback targets (OPS-F03).
            if [ -d "${TARGET_ROOT}/releases" ]; then
              target_root_real="$(readlink -f "${TARGET_ROOT}")"
              releases_root="$(readlink -f "${TARGET_ROOT}/releases")"
              if [ "${target_root_real}" = "/" ] ||
                 [ "${releases_root}" != "${target_root_real}/releases" ]; then
                echo "Refusing to prune releases through an unexpected directory or symlink." >&2
                exit 1
              fi
              current_release="$(readlink -f "${TARGET_ROOT}/current" 2>/dev/null || true)"
              echo "Pruning old releases in ${releases_root}, keeping the newest 5 and rollback targets..."
              find "${releases_root}" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\0' |
                sort -z -nr |
                tail -z -n +6 |
                while IFS= read -r -d '' candidate; do
                  old_release="${candidate#* }"
                  resolved_release="$(readlink -f "${old_release}")"
                  case "${resolved_release}" in
                    "${releases_root}/"*) ;;
                    *) echo "Refusing to prune a path outside the release directory." >&2; exit 1 ;;
                  esac
                  if [ "${resolved_release}" = "${current_release}" ] ||
                     [ "${resolved_release}" = "${previous_release}" ]; then
                    continue
                  fi
                  rm -rf -- "${resolved_release}"
                done
            fi
