name: Deploy to Ubuntu VPC
on:
  push:
    branches: [cuongnk/implement-api-contract]
    paths: [.github/workflows/deployment.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  cleanup-temporary-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Remove temporary Actions entries and their runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = 'https://api.github.com/repos/FPTU-Xperience/fptu-xperience-clubhub-api/actions';
          const headers = { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          const request = async (url, method = 'GET') => {
            const response = await fetch(url, { method, headers });
            if (!response.ok) throw new Error(method + ' ' + url + ': ' + response.status + ' ' + await response.text());
            return response.status === 204 ? null : response.json();
          };
          const targets = new Set(['activity-registration-checks.yml', 'activity-audience-online.yml',
            'activity-release-cache-cleanup.yml', 'activity-release-diagnostics.yml', 'deploy-activity-image.yml',
            'stop-orphan-release-build.yml']);
          const list = await request(base + '/workflows?per_page=100');
          for (const workflow of list.workflows.filter(item => targets.has(item.path.split('/').at(-1)))) {
            await request(base + '/workflows/' + workflow.id + '/disable', 'PUT');
            let deleted = 0;
            for (let iteration = 0; iteration < 20; iteration++) {
              const runs = await request(base + '/workflows/' + workflow.id + '/runs?per_page=100');
              if (!runs.workflow_runs.length) break;
              for (const run of runs.workflow_runs) {
                if (run.status !== 'completed') {
                  await request(base + '/runs/' + run.id + '/cancel', 'POST');
                  let stopped = false;
                  for (let i = 0; i < 30; i++) {
                    if ((await request(base + '/runs/' + run.id)).status === 'completed') { stopped = true; break; }
                    await new Promise(resolve => setTimeout(resolve, 1000));
                  }
                  assert.ok(stopped, 'Temporary run stopped before removal');
                }
                await request(base + '/runs/' + run.id, 'DELETE');
                deleted++;
              }
            }
            const remaining = await request(base + '/workflows/' + workflow.id + '/runs?per_page=1');
            assert.equal(remaining.total_count, 0);
            console.log('REMOVED_TEMPORARY_ACTIONS ' + workflow.name + ' runs=' + deleted);
          }
          const after = await request(base + '/workflows?per_page=100');
          for (const workflow of after.workflows) {
            if (targets.has(workflow.path.split('/').at(-1))) assert.notEqual(workflow.state, 'active');
          }
          console.log('ACTIONS_CLEANUP_OK: temporary workflows disabled, temporary runs removed; original workflows retained');
          NODE

  inspect-public-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Read public activity registration state only
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPC_HOST }}
          username: ${{ secrets.VPC_USERNAME }}
          key: ${{ secrets.VPC_SSH_KEY }}
          passphrase: ${{ secrets.VPC_SSH_PASSPHRASE }}
          password: ${{ secrets.VPC_PASSWORD }}
          command_timeout: 2m
          script: |
            docker exec clubreporthub-sqlserver bash -c 'SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -d ClubReportHub_Activity -W -s "|" -Q "SET NOCOUNT ON; SELECT SYSUTCDATETIME() AS NowUtc; SELECT PublicationStatus, Status, COUNT(*) AS Total, SUM(CASE WHEN RegistrationOpensAt <= SYSUTCDATETIME() AND RegistrationClosesAt > SYSUTCDATETIME() THEN 1 ELSE 0 END) AS OpenRegistrationWindows FROM Activities WHERE IsInternal = 0 GROUP BY PublicationStatus, Status; SELECT TOP(12) Id, Title, PublicationStatus, Status, RegistrationOpensAt, RegistrationClosesAt, StartTimeUtc, EndTimeUtc, Capacity, RegisteredCount FROM Activities WHERE IsInternal = 0 ORDER BY Id DESC;"'
