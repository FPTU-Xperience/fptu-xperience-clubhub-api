            project="$(docker inspect clubreporthub-${{ matrix.name }} --format '{{ index .Config.Labels "com.docker.compose.project" }}')"
            workdir="$(docker inspect clubreporthub-${{ matrix.name }} --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}')"
            configs="$(docker inspect clubreporthub-${{ matrix.name }} --format '{{ index .Config.Labels "com.docker.compose.project.config_files" }}')"
