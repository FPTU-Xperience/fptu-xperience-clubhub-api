name: Inspect VPC release storage
on:
  workflow_dispatch:
    inputs:
      reclaim_build_cache:
        description: Remove unused Docker build cache older than 72 hours
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  storage:
    if: github.ref == 'refs/heads/ops/check-tester-release-storage'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - name: Check release filesystem and SQL backup storage
        uses: appleboy/ssh-action@v1.0.3
        env:
          RECLAIM_BUILD_CACHE: ${{ inputs.reclaim_build_cache }}
        with:
          host: ${{ secrets.VPC_HOST }}
          username: ${{ secrets.VPC_USERNAME }}
          key: ${{ secrets.VPC_SSH_KEY }}
          passphrase: ${{ secrets.VPC_SSH_PASSPHRASE }}
          password: ${{ secrets.VPC_PASSWORD }}
          envs: RECLAIM_BUILD_CACHE
          command_timeout: 5m
          script: |
            set -Eeuo pipefail
            docker_root="$(docker info --format '{{.DockerRootDir}}')"
            df -hP "$docker_root"
            df -iP "$docker_root"
            docker system df
            docker exec clubreporthub-sqlserver df -hP /var/opt/mssql
            docker exec clubreporthub-sqlserver sh -c "find /var/opt/mssql -maxdepth 1 -type f -name 'backup_*.bak' -printf '%s\n' | awk '{bytes+=\$1} END {print \"SQL backup files:\", NR, \"total bytes:\", bytes}'"
            if [ "${RECLAIM_BUILD_CACHE}" = "true" ]; then
              docker builder prune --force --filter until=72h
              df -hP "$docker_root"
              docker exec clubreporthub-sqlserver df -hP /var/opt/mssql
            fi
