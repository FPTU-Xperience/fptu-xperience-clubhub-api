name: Recover room mapping deployment storage
on:
  workflow_dispatch:
    inputs:
      reclaim_build_cache:
        description: Remove unused Docker build cache older than 24 hours
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  storage:
    if: github.ref == 'refs/heads/ops/room-mapping-deploy-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - name: Check release filesystem and SQL backup storage
        uses: appleboy/ssh-action@v1.0.3
        env:
          RECLAIM_BUILD_CACHE: ${{ inputs.reclaim_build_cache }}
        with:
          host: ${{ secrets.VPC_HOST }}
          username: ${{ secrets.VPC_USERNAME }}
          key: ${{ secrets.VPC_SSH_KEY }}
          passphrase: ${{ secrets.VPC_SSH_PASSPHRASE }}
          password: ${{ secrets.VPC_PASSWORD }}
          envs: RECLAIM_BUILD_CACHE
          command_timeout: 5m
          script: |
            set -Eeuo pipefail
            docker_root="$(docker info --format '{{.DockerRootDir}}')"
            df -hP "$docker_root"
            df -iP "$docker_root"
            docker system df
            if [ "${RECLAIM_BUILD_CACHE}" = "true" ]; then
              docker builder prune --all --force --filter until=24h
              df -hP "$docker_root"
            fi
            docker ps --format 'table {{.Names}}\t{{.Status}}'
            docker exec clubreporthub-sqlserver df -hP /var/opt/mssql