name: Deploy to Ubuntu VPC
on:
  push:
    branches: [cuongnk/implement-api-contract]
    paths: [.github/workflows/deployment.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  build-club:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 39b82c5942c24f0ab9e68f6687891162f5c15ec7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build validated release and pre-change rollback image on CI
        run: |
          git checkout --detach 6a73da218ebee059bdf3f1850bb4ef1fe637dd9a
          docker build --file src/Services/ClubService/Dockerfile --tag clubreporthub-club:rollback-6a73da218ebee059bdf3f1850bb4ef1fe637dd9a .
          docker build --file src/Services/ActivityService/Dockerfile --tag clubreporthub-activity:rollback-6a73da218ebee059bdf3f1850bb4ef1fe637dd9a .
          git checkout --detach 39b82c5942c24f0ab9e68f6687891162f5c15ec7
          docker build --file src/Services/ClubService/Dockerfile --tag clubreporthub-club:39b82c5942c24f0ab9e68f6687891162f5c15ec7 .
          docker build --file src/Services/ActivityService/Dockerfile --tag clubreporthub-activity:39b82c5942c24f0ab9e68f6687891162f5c15ec7 .
          mkdir -p club-image
          docker save clubreporthub-club:rollback-6a73da218ebee059bdf3f1850bb4ef1fe637dd9a clubreporthub-club:39b82c5942c24f0ab9e68f6687891162f5c15ec7 clubreporthub-activity:rollback-6a73da218ebee059bdf3f1850bb4ef1fe637dd9a clubreporthub-activity:39b82c5942c24f0ab9e68f6687891162f5c15ec7 | gzip > club-image/images.tar.gz
          sha256sum club-image/images.tar.gz > club-image/images.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: validated-club-release
          path: club-image
          retention-days: 3

  deploy:
    needs: build-club
    if: github.ref == 'refs/heads/cuongnk/implement-api-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validated-club-release
          path: club-image
      - name: Verify source validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          let run;
          for (let attempt=0; attempt<90; attempt++) {
          const response = await fetch('https://api.github.com/repos/FPTU-Xperience/fptu-xperience-clubhub-api/actions/runs/41809510510',
            { headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN } });
          assert.equal(response.status, 200);
          run = await response.json();
          if (run.status === 'completed') break;
          await new Promise(resolve => setTimeout(resolve, 10000));
          }
          assert.equal(run.status, 'completed');
          assert.equal(run.head_sha, '39b82c5942c24f0ab9e68f6687891162f5c15ec7');
          assert.equal(run.conclusion, 'success');
          NODE
      - name: Transfer images
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPC_HOST }}
          username: ${{ secrets.VPC_USERNAME }}
          key: ${{ secrets.VPC_SSH_KEY }}
          passphrase: ${{ secrets.VPC_SSH_PASSPHRASE }}
          password: ${{ secrets.VPC_PASSWORD }}
          source: club-image
          target: /${{ secrets.VPC_USERNAME }}/fptux/legacy/legacy-api/releases/39b82c5942c24f0ab9e68f6687891162f5c15ec7/prebuilt-final
          rm: false
      - name: Rollout validated ClubService with existing runtime config
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_DIR: /${{ secrets.VPC_USERNAME }}/fptux/legacy/legacy-api/releases/39b82c5942c24f0ab9e68f6687891162f5c15ec7/prebuilt-final
          IMAGE_TAG: clubreporthub-club:39b82c5942c24f0ab9e68f6687891162f5c15ec7
          ROLLBACK_TAG: clubreporthub-club:rollback-6a73da218ebee059bdf3f1850bb4ef1fe637dd9a
          ACTIVITY_IMAGE_TAG: clubreporthub-activity:39b82c5942c24f0ab9e68f6687891162f5c15ec7
          ACTIVITY_ROLLBACK_TAG: clubreporthub-activity:rollback-6a73da218ebee059bdf3f1850bb4ef1fe637dd9a
        with:
          host: ${{ secrets.VPC_HOST }}
          username: ${{ secrets.VPC_USERNAME }}
          key: ${{ secrets.VPC_SSH_KEY }}
          passphrase: ${{ secrets.VPC_SSH_PASSPHRASE }}
          password: ${{ secrets.VPC_PASSWORD }}
          envs: IMAGE_DIR,IMAGE_TAG,ROLLBACK_TAG,ACTIVITY_IMAGE_TAG,ACTIVITY_ROLLBACK_TAG
          command_timeout: 15m
          script: |
            set -Eeuo pipefail
            umask 077
            cd "${IMAGE_DIR}"
            sha256sum --check club-image/images.sha256
            project="$(docker inspect clubreporthub-club --format '{{ index .Config.Labels "com.docker.compose.project" }}')"
            workdir="$(docker inspect clubreporthub-club --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}')"
            configs="$(docker inspect clubreporthub-club --format '{{ index .Config.Labels "com.docker.compose.project.config_files" }}')"
            service="$(docker inspect clubreporthub-club --format '{{ index .Config.Labels "com.docker.compose.service" }}')"
            test "${service}" = club-service
            test -n "${project}"
            test -d "${workdir}"
            network="$(docker inspect clubreporthub-club --format '{{range $name, $details := .NetworkSettings.Networks}}{{$name}}{{"\n"}}{{end}}' | head -n 1)"
            docker load --input club-image/images.tar.gz
            new_image="$(docker image inspect "${IMAGE_TAG}" --format '{{.Id}}')"
            docker image inspect "${ROLLBACK_TAG}" --format '{{.Id}}'
            override="${IMAGE_DIR}/activity.override.yml"
            printf 'services:\n  club-service:\n    image: %s\n  activity-service:\n    image: %s\n' "${IMAGE_TAG}" "${ACTIVITY_IMAGE_TAG}" > "${override}"
            args=()
            IFS=',' read -ra files <<< "${configs}"
            for file in "${files[@]}"; do test -f "${file}"; args+=(-f "${file}"); done
            cd "${workdir}"
            runtime_exports="$(python3 - <<'PY'
            import json, re, shlex, subprocess
            values = {}
            for name in ('clubreporthub-club', 'clubreporthub-activity', 'clubreporthub-gateway'):
                data = json.loads(subprocess.check_output(['docker', 'inspect', '--format', '{{json .Config.Env}}', name], text=True))
                current = dict(item.split('=', 1) for item in data)
                if name == 'clubreporthub-club':
                    mapping = {
                        'JWT_SIGNING_KEY': 'Jwt__SigningKey',
                        'INTERNAL_WORKFLOW_TOKEN': 'Security__InternalWorkflowToken',
                        'ATTENDANCE_SIGNING_KEY': 'Attendance__SigningKey',
                        'REDIS_STREAM_NAME': 'Redis__StreamName'
                    }
                    for variable, key in mapping.items():
                        if current.get(key):
                            values[variable] = current[key]
                    connection = current.get('ConnectionStrings__DefaultConnection', '')
                    pattern = r'''(?:^|;)\s*(?:Password|Pwd)\s*=\s*("(?:""|[^"])*"|'(?:''|[^'])*'|[^;]*)'''
                    match = re.search(pattern, connection, re.IGNORECASE)
                    if not match:
                        raise RuntimeError('Current ClubService database password could not be preserved')
                    values['SQL_PASSWORD'] = match.group(1).strip()
                elif name == 'clubreporthub-activity':
                    values['ATTENDANCE_SIGNING_KEY'] = current.get('Attendance__SigningKey', '')
                else:
                    values['FRONTEND_ORIGIN'] = current.get('Cors__AllowedOrigins__0', '')
            for variable in ('SQL_PASSWORD', 'JWT_SIGNING_KEY', 'INTERNAL_WORKFLOW_TOKEN', 'ATTENDANCE_SIGNING_KEY', 'FRONTEND_ORIGIN'):
                if not values.get(variable):
                    raise RuntimeError('Missing current runtime setting: ' + variable)
            for variable, value in values.items():
                print('export ' + variable + '=' + shlex.quote(value))
            PY
            )"
            eval "${runtime_exports}"
            unset runtime_exports
            new_activity_image="$(docker image inspect "${ACTIVITY_IMAGE_TAG}" --format '{{.Id}}')"
            successful=false
            if docker compose -p "${project}" "${args[@]}" -f "${override}" up -d --no-build --no-deps club-service activity-service; then
              for attempt in $(seq 1 30); do
                if [ "$(docker inspect clubreporthub-club --format '{{.Image}}')" = "${new_image}" ] &&
                  docker run --rm --network "${network}" curlimages/curl:8.10.1 --fail --silent --show-error --connect-timeout 3 --max-time 5 http://club-service:8080/health && [ "$(docker inspect clubreporthub-activity --format '{{.Image}}')" = "${new_activity_image}" ] && docker run --rm --network "${network}" curlimages/curl:8.10.1 --fail --silent --show-error --connect-timeout 3 --max-time 5 http://activity-service:8080/health; then
                  successful=true
                  break
                fi
                sleep 2
              done
            fi
            if [ "${successful}" != true ]; then
              printf 'services:\n  club-service:\n    image: %s\n  activity-service:\n    image: %s\n' "${ROLLBACK_TAG}" "${ACTIVITY_ROLLBACK_TAG}" > "${override}"
              docker compose -p "${project}" "${args[@]}" -f "${override}" up -d --no-build --no-deps club-service activity-service
              echo 'Activity rollout failed; restored image built from pre-change source.' >&2
              exit 1
            fi
            printf 'CLUB_IMAGE_DEPLOYED 39b82c5942c24f0ab9e68f6687891162f5c15ec7 %s\n' "${new_image}"

            printf 'ACTIVITY_IMAGE_DEPLOYED 39b82c5942c24f0ab9e68f6687891162f5c15ec7 %s\n' "${new_activity_image}"

      - name: Verify online health and authorization
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = 'https://clubreporthub.duckdns.org';
          for (const path of ['/health', '/api/health', '/api/auth/health']) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(20000) });
            assert.equal(response.status, 200, path);
            console.log('ONLINE_HEALTH_OK ' + path + ' 200');
          }
          for (const path of ['/api/clubs/1/roles', '/api/v2/activities/1']) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(20000) });
            assert.equal(response.status, 401, path);
            console.log('ONLINE_AUTH_BOUNDARY_OK ' + path + ' 401');
          }
          console.log('ONLINE_CLUB_RELEASE_OK 39b82c5942c24f0ab9e68f6687891162f5c15ec7');
          NODE
