name: Backend validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Backend_Validation_CI_Only_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Backend_Validation_CI_Only_2026!' -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 20s

    env:
      CI: "true"
      SQL_PASSWORD: "Backend_Validation_CI_Only_2026!"
      JWT_SIGNING_KEY: "ci-only-signing-key-with-at-least-32-characters"
      FRONTEND_ORIGIN: "https://ci.example.invalid"
      ADMIN_SERVICE_TEST_CONNECTION_STRING: "Server=localhost,1433;Initial Catalog=master;User Id=sa;Password=Backend_Validation_CI_Only_2026!;Encrypt=True;TrustServerCertificate=True"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ClubReportHub.sln

      - name: Verify formatting
        run: |
          # Keep formatting scoped to the stabilized services/tests to avoid a repository-wide rewrite.
          dotnet format src/Services/AdminService/AdminService.csproj --no-restore --verify-no-changes
          dotnet format src/Services/AuthService/AuthService.csproj --no-restore --verify-no-changes
          dotnet format src/Services/ClubService/ClubService.csproj --no-restore --verify-no-changes
          dotnet format tests/AdminService.IntegrationTests/AdminService.IntegrationTests.csproj --no-restore --verify-no-changes
          dotnet format tests/Backend.StabilizationTests/Backend.StabilizationTests.csproj --no-restore --verify-no-changes
          dotnet format src/Shared/ClubReportHub.Shared/ClubReportHub.Shared.csproj \
            --no-restore \
            --verify-no-changes \
            --include \
              src/Shared/ClubReportHub.Shared/Auth/JwtServiceCollectionExtensions.cs \
              src/Shared/ClubReportHub.Shared/Tracing/CorrelationIdMiddleware.cs

      - name: Build
        run: dotnet build ClubReportHub.sln --configuration Release --no-restore -warnaserror

      - name: Test full solution (TEST-F01, TEST-F02, TEST-F03, TEST-F04, TEST-F06)
        run: |
          dotnet test ClubReportHub.sln \
            --configuration Release \
            --no-build \
            --logger "trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Upload test results and coverage (TEST-F06)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

      - name: Verify EF models match migrations (TEST-F05)
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.18
          for project in \
            src/Services/AdminService/AdminService.csproj \
            src/Services/AuthService/AuthService.csproj \
            src/Services/ClubService/ClubService.csproj \
            src/Services/ActivityService/ActivityService.csproj \
            src/Services/ReportService/ReportService.csproj \
            src/Services/FinanceService/FinanceService.csproj \
            src/Services/ExportService/ExportService.csproj \
            src/Services/NotificationService/NotificationService.csproj; do
            dotnet ef migrations has-pending-model-changes \
              --project "$project" \
              --startup-project "$project" \
              --configuration Release \
              --no-build
          done

      - name: Scan for vulnerable dependencies (SEC-F12)
        run: |
          # Hard gate: any vulnerable package (direct or transitive) fails the build.
          # The solution is currently clean; regressions must be fixed by pinning the
          # offending package, not by relaxing this check.
          set -o pipefail
          if ! dotnet list ClubReportHub.sln package --vulnerable --include-transitive | tee vulnerable.txt; then
            echo "::error::Dependency vulnerability scan failed to run — treat as a gate failure."
            exit 1
          fi

          # A missing scan result must never read as a clean scan.
          if ! grep -q "vulnerable packages" vulnerable.txt; then
            echo "::error::Scan produced no per-project verdict — refusing to pass silently."
            exit 1
          fi

          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable packages detected — pin the offending package before merging."
            exit 1
          fi

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build AdminService production image
        run: docker build --file src/Services/AdminService/Dockerfile --tag clubreporthub-admin:ci .
