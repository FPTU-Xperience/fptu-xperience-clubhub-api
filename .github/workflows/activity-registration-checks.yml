name: Activity registration graph checks
on:
  push:
    branches: [fix/activity-internal-registration-20261103]
    paths: [.github/workflows/activity-registration-checks.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GitNexus
        run: npm install --global gitnexus
      - uses: actions/cache@v4
        with:
          path: |
            .gitnexus
            ~/.gitnexus
          key: activity-graph-977eab9-v1
      - name: Index and inspect graph
        run: |
          gitnexus analyze --index-only
          gitnexus status
          gitnexus query "activity eligibility internal public participant registration" --repo .
          gitnexus context RegisterParticipant --repo .
          gitnexus impact RegisterParticipant --direction upstream --repo .
          gitnexus context ActivityEligibility --repo .
          gitnexus impact ActivityEligibility --direction upstream --repo .
          gitnexus context StudentActivityEndpoints --repo .
          gitnexus impact StudentActivityEndpoints --direction upstream --repo .
          gitnexus context 'Method:src/Services/ActivityService/Services/ActivityEligibility.cs:ActivityEligibility.ResolveAsync#6' --repo .
          gitnexus impact 'Method:src/Services/ActivityService/Services/ActivityEligibility.cs:ActivityEligibility.ResolveAsync#6' --direction upstream --repo .
          gitnexus impact 'Method:src/Services/ActivityService/Endpoints/StudentActivityEndpoints.cs:StudentActivityEndpoints.ReadAsync#17' --direction upstream --repo .
          gitnexus impact 'Method:src/Services/ActivityService/Endpoints/StudentActivityEndpoints.cs:StudentActivityEndpoints.Eligibility#2' --direction upstream --repo .
          gitnexus impact 'Method:src/Services/ActivityService/Endpoints/ActivityEndpointHelpers.cs:ActivityEndpointHelpers.ToResponse#2' --direction upstream --repo .
          git grep -n -E 'Eligibility|RegisterParticipant|ActivityEligibility.ResolveAsync|MapStudentActivityEndpoints' src/Services/ActivityService tests/Backend.StabilizationTests
          gitnexus context StudentSessionSourceEndpoints --repo .
          gitnexus impact 'Method:src/Services/ActivityService/Endpoints/StudentSessionSourceEndpoints.cs:StudentSessionSourceEndpoints.ReadAsync#9' --direction upstream --repo .
          gitnexus impact 'Method:src/Services/ActivityService/Endpoints/SessionAttendanceEndpoints.cs:SessionAttendanceEndpoints.CheckInAsync#7' --direction upstream --repo .
          git grep -n -E 'StudentActivityItem|MapStudentSessionSourceEndpoints|SessionAttendanceEndpoints.CheckInAsync' -- src tests
          gitnexus detect-changes --scope all --repo .
