name: Activity registration graph checks
on:
  push:
    branches: [fix/activity-audience-production-20261103]
    paths: [.github/workflows/activity-registration-checks.yml]
  workflow_dispatch:
permissions:
  contents: read
env:
  CI: "true"
  SQL_PASSWORD: "Backend_Validation_CI_Only_2026!"
  JWT_SIGNING_KEY: "ci-only-signing-key-with-at-least-32-characters"
  INTERNAL_WORKFLOW_TOKEN: "ci-only-workflow-secret-at-least-32-characters"
  ATTENDANCE_SIGNING_KEY: "ci-only-attendance-secret-at-least-32-characters"
  FRONTEND_ORIGIN: "https://ci.example.invalid"
  ADMIN_SERVICE_TEST_CONNECTION_STRING: "Server=localhost,1433;Initial Catalog=master;User Id=sa;Password=Backend_Validation_CI_Only_2026!;Encrypt=True;TrustServerCertificate=True"
  FINANCE_SERVICE_TEST_CONNECTION_STRING: "Server=localhost,1433;Initial Catalog=master;User Id=sa;Password=Backend_Validation_CI_Only_2026!;Encrypt=True;TrustServerCertificate=True"

jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Backend_Validation_CI_Only_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Backend_Validation_CI_Only_2026!' -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install GitNexus
        run: npm install --global gitnexus
      - uses: actions/cache@v4
        with:
          path: |
            .gitnexus
            ~/.gitnexus
          key: activity-graph-prod-0a638e-v1
      - name: Index and inspect graph
        run: |
          gitnexus analyze --index-only
          gitnexus status
          gitnexus query "activity eligibility internal public participant registration" --repo .
          gitnexus context RegisterParticipant --repo .
          gitnexus impact RegisterParticipant --direction upstream --repo .
          gitnexus context ActivityEligibility --repo .
          gitnexus impact ActivityEligibility --direction upstream --repo .
          gitnexus context StudentActivityEndpoints --repo .
          gitnexus impact StudentActivityEndpoints --direction upstream --repo .
          gitnexus context 'Method:src/Services/ActivityService/Services/ActivityEligibility.cs:ActivityEligibility.ResolveAsync#6' --repo .
          gitnexus impact 'Method:src/Services/ActivityService/Services/ActivityEligibility.cs:ActivityEligibility.ResolveAsync#6' --direction upstream --repo .
          gitnexus impact 'Method:src/Services/ActivityService/Endpoints/StudentActivityEndpoints.cs:StudentActivityEndpoints.ReadAsync#17' --direction upstream --repo .
          gitnexus impact 'Method:src/Services/ActivityService/Endpoints/StudentActivityEndpoints.cs:StudentActivityEndpoints.Eligibility#2' --direction upstream --repo .
          gitnexus impact 'Method:src/Services/ActivityService/Endpoints/ActivityEndpointHelpers.cs:ActivityEndpointHelpers.ToResponse#2' --direction upstream --repo .
          git grep -n -E 'Eligibility|RegisterParticipant|ActivityEligibility.ResolveAsync|MapStudentActivityEndpoints' src/Services/ActivityService tests/Backend.StabilizationTests
          gitnexus context StudentSessionSourceEndpoints --repo .
          gitnexus impact 'Method:src/Services/ActivityService/Endpoints/StudentSessionSourceEndpoints.cs:StudentSessionSourceEndpoints.ReadAsync#9' --direction upstream --repo .
          gitnexus impact 'Method:src/Services/ActivityService/Endpoints/SessionAttendanceEndpoints.cs:SessionAttendanceEndpoints.CheckInAsync#7' --direction upstream --repo .
          git grep -n -E 'StudentActivityItem|MapStudentSessionSourceEndpoints|SessionAttendanceEndpoints.CheckInAsync' -- src tests
          gitnexus detect-changes --scope all --repo .

      - name: Check existing session fixture impact before applying candidate
        run: |
          gitnexus context CreateSessionSourceAppAsync --repo .
          gitnexus impact CreateSessionSourceAppAsync --direction upstream --repo . > /tmp/session-fixture-impact.txt
          cat /tmp/session-fixture-impact.txt
          python3 - <<'PY'
          import json
          text = open('/tmp/session-fixture-impact.txt').read()
          result = json.loads(text[text.index('{'):])
          assert result.get('risk') not in ['HIGH', 'CRITICAL'], 'Review high impact before changing fixture'
          assert result.get('status') != 'ambiguous', 'Disambiguate fixture symbol'
          PY
      - name: Apply reviewed source candidate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const patch = JSON.parse(fs.readFileSync('.github/validation/activity-audience-patch.json', 'utf8'));
          for (const [path, content] of Object.entries(patch)) fs.writeFileSync(path, content);
          NODE
          git add src/Services/ActivityService tests/Backend.StabilizationTests/ActivityAudienceRegressionTests.cs tests/Backend.StabilizationTests/StudentSessionSourceTests.cs
      - name: Analyze source changes before commit
        run: |
          gitnexus detect-changes --scope all --repo .
          git diff --cached --stat
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run audience, registration, session and experience regressions
        run: |
          dotnet test tests/Backend.StabilizationTests/Backend.StabilizationTests.csproj --configuration Release --logger 'console;verbosity=normal'
