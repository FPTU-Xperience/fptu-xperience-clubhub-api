services:
  # ============================================================================
  # 1. Infrastructure: SQL Server 2022
  # ============================================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: clubreporthub-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD:?SQL_PASSWORD is required}"
      MSSQL_PID: "Developer"
      MSSQL_MEMORY_LIMIT_MB: "1536"
    volumes:
      - sqlserver_data:/var/opt/mssql
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1800M
          pids: 200
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" 2>/dev/null || /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "ClubReportHub!2026" -C -Q "SELECT 1" 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "ClubReportHub!2026" -Q "SELECT 1" 2>/dev/null || exit 1',
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 45s
    networks:
      - internal-net

  # ============================================================================
  # 2. Infrastructure: Redis Streams Message Broker
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: clubreporthub-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M
          pids: 100
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal-net

  # ============================================================================
  # 3. KpiGrpcService (gRPC Service)
  # ============================================================================
  kpi-grpc-service:
    build:
      context: .
      dockerfile: src/Services/KpiGrpcService/Dockerfile
    container_name: clubreporthub-kpi-grpc
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_gcServer: "0"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 200M
          pids: 100
    networks:
      - internal-net

  # ============================================================================
  # 4. AuthService
  # ============================================================================
  auth-service:
    build:
      context: .
      dockerfile: src/Services/AuthService/Dockerfile
    container_name: clubreporthub-auth
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_gcServer: "0"
      Cors__AllowedOrigins__0: "${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}"
      Cors__AllowedOrigins__1: "https://fptux-clubhub-ui.pages.dev"
      Cors__AllowedOrigins__2: "https://*.fptux-clubhub-ui.pages.dev"
      Cors__AllowedOrigins__3: "https://fptux-legacy-ui.pages.dev"
      Cors__AllowedOrigins__4: "https://*.fptux-legacy-ui.pages.dev"
      Cors__AdditionalOrigins: "${CORS_ADDITIONAL_ORIGINS:-}"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ClubReportHub_Auth;User Id=sa;Password=${SQL_PASSWORD:?SQL_PASSWORD is required};TrustServerCertificate=True;"
      Jwt__Issuer: "ClubReportHub"
      Jwt__Audience: "ClubReportHub.Client"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}"
      Jwt__ExpirationMinutes: "30"
      GoogleAuthentication__ClientId: "${GOOGLE_CLIENT_ID:-}"
      GoogleAuthentication__AllowedHostedDomain: "${GOOGLE_ALLOWED_HOSTED_DOMAIN:-}"
      GoogleAuthentication__AllowedEmailDomains: "${GOOGLE_ALLOWED_EMAIL_DOMAINS:-fpt.edu.vn, gmail.com}"
      ENABLE_DEV_LOGIN: "${ENABLE_DEV_LOGIN:-true}"
      Auth__EnableDevLogin: "${ENABLE_DEV_LOGIN:-true}"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 250M
          pids: 100
    networks:
      - internal-net

  # ============================================================================
  # 5. ClubService
  # ============================================================================
  club-service:
    build:
      context: .
      dockerfile: src/Services/ClubService/Dockerfile
    container_name: clubreporthub-club
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_gcServer: "0"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ClubReportHub_Club;User Id=sa;Password=${SQL_PASSWORD:?SQL_PASSWORD is required};TrustServerCertificate=True;"
      Jwt__Issuer: "ClubReportHub"
      Jwt__Audience: "ClubReportHub.Client"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}"
      Redis__ConnectionString: "redis:6379"
      Redis__StreamName: "${REDIS_STREAM_NAME:-clubreporthub-events}"
      Services__ActivityService__BaseUrl: "http://activity-service:8080/"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 250M
          pids: 100
    networks:
      - internal-net

  # ============================================================================
  # 6. ActivityService
  # ============================================================================
  activity-service:
    build:
      context: .
      dockerfile: src/Services/ActivityService/Dockerfile
    container_name: clubreporthub-activity
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_gcServer: "0"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ClubReportHub_Activity;User Id=sa;Password=${SQL_PASSWORD:?SQL_PASSWORD is required};TrustServerCertificate=True;"
      Jwt__Issuer: "ClubReportHub"
      Jwt__Audience: "ClubReportHub.Client"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}"
      Redis__ConnectionString: "redis:6379"
      Redis__StreamName: "${REDIS_STREAM_NAME:-clubreporthub-events}"
      Services__ClubService__BaseUrl: "http://club-service:8080/"
      Services__ReportService__BaseUrl: "http://report-service:8080/"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 250M
          pids: 100
    networks:
      - internal-net

  # ============================================================================
  # 7. ReportService
  # ============================================================================
  report-service:
    build:
      context: .
      dockerfile: src/Services/ReportService/Dockerfile
    container_name: clubreporthub-report
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      kpi-grpc-service:
        condition: service_started
    volumes:
      - report_attachments:/app/attachments
      - report_uploads:/app/report-uploads
      - report_previews:/app/report-previews
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_gcServer: "0"
      DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2UNENCRYPTEDSUPPORT: "1"
      Uploads__PreviewStoragePath: "/app/report-previews"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ClubReportHub_Report;User Id=sa;Password=${SQL_PASSWORD:?SQL_PASSWORD is required};TrustServerCertificate=True;"
      Jwt__Issuer: "ClubReportHub"
      Jwt__Audience: "ClubReportHub.Client"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}"
      Redis__ConnectionString: "redis:6379"
      Redis__StreamName: "${REDIS_STREAM_NAME:-clubreporthub-events}"
      Services__ClubService__BaseUrl: "http://club-service:8080/"
      Services__KpiGrpcService__BaseUrl: "http://kpi-grpc-service:8080"
      Services__FinanceService__BaseUrl: "http://finance-service:8080/"
      Services__ActivityService__BaseUrl: "http://activity-service:8080/"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 300M
          pids: 100
    networks:
      - internal-net

  # ============================================================================
  # 8. FinanceService
  # ============================================================================
  finance-service:
    build:
      context: .
      dockerfile: src/Services/FinanceService/Dockerfile
    container_name: clubreporthub-finance
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_gcServer: "0"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ClubReportHub_Finance;User Id=sa;Password=${SQL_PASSWORD:?SQL_PASSWORD is required};TrustServerCertificate=True;"
      Jwt__Issuer: "ClubReportHub"
      Jwt__Audience: "ClubReportHub.Client"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}"
      Redis__ConnectionString: "redis:6379"
      Redis__StreamName: "${REDIS_STREAM_NAME:-clubreporthub-events}"
      Services__ClubService__BaseUrl: "http://club-service:8080/"
      Services__ActivityService__BaseUrl: "http://activity-service:8080/"
      Services__ReportService__BaseUrl: "http://report-service:8080/"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 250M
          pids: 100
    networks:
      - internal-net

  # ============================================================================
  # 9. NotificationService
  # ============================================================================
  notification-service:
    build:
      context: .
      dockerfile: src/Services/NotificationService/Dockerfile
    container_name: clubreporthub-notification
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_gcServer: "0"
      Cors__AllowedOrigins__0: "${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}"
      Cors__AllowedOrigins__1: "https://fptux-clubhub-ui.pages.dev"
      Cors__AllowedOrigins__2: "https://*.fptux-clubhub-ui.pages.dev"
      Cors__AllowedOrigins__3: "https://fptux-legacy-ui.pages.dev"
      Cors__AllowedOrigins__4: "https://*.fptux-legacy-ui.pages.dev"
      Cors__AdditionalOrigins: "${CORS_ADDITIONAL_ORIGINS:-}"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ClubReportHub_Notification;User Id=sa;Password=${SQL_PASSWORD:?SQL_PASSWORD is required};TrustServerCertificate=True;"
      Jwt__Issuer: "ClubReportHub"
      Jwt__Audience: "ClubReportHub.Client"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}"
      Redis__ConnectionString: "redis:6379"
      Redis__StreamName: "${REDIS_STREAM_NAME:-clubreporthub-events}"
      Services__ClubService__BaseUrl: "http://club-service:8080/"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 200M
          pids: 100
    networks:
      - internal-net

  # ============================================================================
  # 10. ExportService
  # ============================================================================
  export-service:
    build:
      context: .
      dockerfile: src/Services/ExportService/Dockerfile
    container_name: clubreporthub-export
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - export_storage:/app/exports
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_gcServer: "0"
      Cors__AllowedOrigins__0: "${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}"
      Cors__AllowedOrigins__1: "https://fptux-clubhub-ui.pages.dev"
      Cors__AllowedOrigins__2: "https://*.fptux-clubhub-ui.pages.dev"
      Cors__AllowedOrigins__3: "https://fptux-legacy-ui.pages.dev"
      Cors__AllowedOrigins__4: "https://*.fptux-legacy-ui.pages.dev"
      Cors__AdditionalOrigins: "${CORS_ADDITIONAL_ORIGINS:-}"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ClubReportHub_Export;User Id=sa;Password=${SQL_PASSWORD:?SQL_PASSWORD is required};TrustServerCertificate=True;"
      Jwt__Issuer: "ClubReportHub"
      Jwt__Audience: "ClubReportHub.Client"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}"
      Redis__ConnectionString: "redis:6379"
      Redis__StreamName: "${REDIS_STREAM_NAME:-clubreporthub-events}"
      Services__ClubService__BaseUrl: "http://club-service:8080/"
      Services__ReportService__BaseUrl: "http://report-service:8080/"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 250M
          pids: 100
    networks:
      - internal-net

  # ============================================================================
  # 11. AdminService
  # ============================================================================
  admin-service:
    build:
      context: .
      dockerfile: src/Services/AdminService/Dockerfile
    container_name: clubreporthub-admin
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_gcServer: "0"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ClubReportHub_Admin;User Id=sa;Password=${SQL_PASSWORD:?SQL_PASSWORD is required};TrustServerCertificate=True;"
      Jwt__Issuer: "ClubReportHub"
      Jwt__Audience: "ClubReportHub.Client"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 250M
          pids: 100
    networks:
      - internal-net

  # ============================================================================
  # 12. API Gateway (YARP) - ONLY SERVICE EXPOSED TO INTERNET
  # ============================================================================
  api-gateway:
    build:
      context: .
      dockerfile: src/Gateway/ApiGateway/Dockerfile
    container_name: clubreporthub-gateway
    restart: unless-stopped
    depends_on:
      - auth-service
      - club-service
      - activity-service
      - report-service
      - finance-service
      - export-service
      - notification-service
      - admin-service
    ports:
      - "${GATEWAY_PORT:-7000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_gcServer: "0"
      Cors__AllowedOrigins__0: "${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}"
      Cors__AllowedOrigins__1: "https://fptux-clubhub-ui.pages.dev"
      Cors__AllowedOrigins__2: "https://*.fptux-clubhub-ui.pages.dev"
      Cors__AllowedOrigins__3: "https://fptux-legacy-ui.pages.dev"
      Cors__AllowedOrigins__4: "https://*.fptux-legacy-ui.pages.dev"
      Cors__AllowedOrigins__5: "http://localhost:*"
      Cors__AllowedOrigins__6: "http://127.0.0.1:*"
      Cors__AllowedOrigins__7: "http://localhost:5173"
      Cors__AllowedOrigins__8: "http://localhost:3000"
      Cors__AllowedOrigins__9: "http://127.0.0.1:5173"
      Cors__AllowedOrigins__10: "http://127.0.0.1:3000"
      Cors__AllowedOrigins__11: "http://localhost:5174"
      Cors__AllowedOrigins__12: "http://localhost:4173"
      Cors__AllowedOrigins__13: "http://127.0.0.1:5174"
      Cors__AllowedOrigins__14: "http://127.0.0.1:4173"
      Cors__AllowedOrigins__15: "https://fptux-admin-ui.pages.dev"
      Cors__AdditionalOrigins: "${CORS_ADDITIONAL_ORIGINS:-}"
      Jwt__Issuer: "ClubReportHub"
      Jwt__Audience: "ClubReportHub.Client"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}"
      Services__AuthServiceUrl: "http://auth-service:8080/"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 250M
          pids: 100
    networks:
      - internal-net

  # ============================================================================
  # 13. One-shot coherent demo dataset (only runs with --profile demo)
  # ============================================================================
  demo-data-seeder:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: src/Tools/DemoDataSeeder/Dockerfile
    restart: "no"
    depends_on:
      auth-service:
        condition: service_started
      club-service:
        condition: service_started
      activity-service:
        condition: service_started
      report-service:
        condition: service_started
      finance-service:
        condition: service_started
      notification-service:
        condition: service_started
      export-service:
        condition: service_started
    environment:
      DemoData__Enabled: "true"
      DemoData__ResetAll: "${DEMO_DATA_RESET_ALL:-false}"
      DemoData__ReferenceDate: "${DEMO_REFERENCE_DATE:-2026-09-11}"
      DemoData__DatabaseWaitSeconds: "180"
      DemoData__ServiceHealthUrls: "http://auth-service:8080/health;http://club-service:8080/health;http://activity-service:8080/health;http://report-service:8080/health;http://finance-service:8080/health;http://notification-service:8080/health;http://export-service:8080/health"
      DemoData__AdminEmail: "${DEMO_ADMIN_EMAIL:-admin@fpt.edu.vn}"
      DemoData__ClubManagerEmail: "${DEMO_CLUB_MANAGER_EMAIL:-manager.tech@fpt.edu.vn}"
      DemoData__StudentEmail: "${DEMO_STUDENT_EMAIL:-se170002@fpt.edu.vn}"
      Redis__ConnectionString: "redis:6379"
      Redis__StreamName: "${REDIS_STREAM_NAME:-clubreporthub-events}"
      ConnectionStrings__Auth: "Server=sqlserver,1433;Database=ClubReportHub_Auth;User Id=sa;Password=${SQL_PASSWORD:?SQL_PASSWORD is required};TrustServerCertificate=True;"
      ConnectionStrings__Club: "Server=sqlserver,1433;Database=ClubReportHub_Club;User Id=sa;Password=${SQL_PASSWORD:?SQL_PASSWORD is required};TrustServerCertificate=True;"
      ConnectionStrings__Activity: "Server=sqlserver,1433;Database=ClubReportHub_Activity;User Id=sa;Password=${SQL_PASSWORD:?SQL_PASSWORD is required};TrustServerCertificate=True;"
      ConnectionStrings__Report: "Server=sqlserver,1433;Database=ClubReportHub_Report;User Id=sa;Password=${SQL_PASSWORD:?SQL_PASSWORD is required};TrustServerCertificate=True;"
      ConnectionStrings__Finance: "Server=sqlserver,1433;Database=ClubReportHub_Finance;User Id=sa;Password=${SQL_PASSWORD:?SQL_PASSWORD is required};TrustServerCertificate=True;"
      ConnectionStrings__Notification: "Server=sqlserver,1433;Database=ClubReportHub_Notification;User Id=sa;Password=${SQL_PASSWORD:?SQL_PASSWORD is required};TrustServerCertificate=True;"
      ConnectionStrings__Export: "Server=sqlserver,1433;Database=ClubReportHub_Export;User Id=sa;Password=${SQL_PASSWORD:?SQL_PASSWORD is required};TrustServerCertificate=True;"
    networks:
      - internal-net

# ==============================================================================
# Persistent Volumes
# ==============================================================================
volumes:
  sqlserver_data:
  redis_data:
  report_attachments:
  report_uploads:
  report_previews:
  export_storage:

# ==============================================================================
# Isolated Internal Network
# ==============================================================================
networks:
  internal-net:
    driver: bridge
